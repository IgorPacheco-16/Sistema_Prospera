{% extends "base/base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/criar_op.css') }}">
{% endblock %}

{% block content %}

<div class="container mt-4 criar-op-page">

    <h2 class="mb-4 text-center fw-bold">Editar OP</h2>

    <div class="card shadow-sm form-card">
        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Nome da OP</label>
                    <input type="text"
                           name="nome"
                           class="form-control"
                           value="{{ op.nome }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Prazo final</label>
                    <input type="date"
                           name="prazo"
                           class="form-control"
                           value="{{ op.prazo_final.strftime('%Y-%m-%d') if op.prazo_final else '' }}">
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input"
                           type="checkbox"
                           role="switch"
                           id="altaPrioridade"
                           name="alta_prioridade"
                           {{ 'checked' if op.alta_prioridade else '' }}>
                    <label class="form-check-label fw-semibold" for="altaPrioridade">
                        Alta prioridade
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Setores participantes</label>

                    <div class="row g-3">
                        {% for setor in setores %}
                        <div class="col-md-6">
                            <label class="setor-card">
                                <input type="checkbox"
                                       name="setores"
                                       value="{{ setor.id }}"
                                       {% for op_setor in op.op_setores %}
                                           {% if op_setor.setor_id == setor.id %}
                                               checked
                                           {% endif %}
                                       {% endfor %}>

                                <span class="setor-label">
                                    {{ setor.nome }}
                                </span>
                            </label>
                        </div>
                        {% endfor %}
                    </div>

                    <div class="form-text mt-2">
                        Setores com tarefas existentes serao mantidos para proteger os dados da OP.
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('ver_op', id=op.id) }}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-success">
                        Salvar alterações
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
