<!DOCTYPE html>
<html>

<head>
    <title>Criar OP</title>

    <!-- Darkmode -->
    <script>
    (function() {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    })();
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

{% include "menu.html" %}

<div class="container mt-4">

    <h2 class="mb-4">➕ Criar Nova OP</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">

                <!-- NOME -->
                <div class="mb-3">
                    <label class="form-label">Nome do Projeto</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>

                <!-- PRAZO -->
                <div class="mb-3">
                    <label class="form-label">Prazo Final</label>
                    <input type="date" name="prazo" class="form-control" required>
                </div>

                <!-- SETORES -->
                <div class="mb-3">
    <label class="form-label">Selecione os setores</label>

    {% for setor in setores %}
        <div class="form-check">
            <input class="form-check-input"
                   type="checkbox"
                   name="setores"
                   value="{{ setor.id }}">

            <label class="form-check-label">
                {{ setor.nome }}
            </label>
        </div>
    {% endfor %}

</div>

                <!-- BOTÕES -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success">
                        Criar OP
                    </button>

                    <a href="/dashboard" class="btn btn-outline-light">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

<!-- Darkmode global -->
<script>
function toggleDarkMode() {
    const html = document.documentElement;

    html.classList.toggle("dark-mode");

    const isDark = html.classList.contains("dark-mode");

    localStorage.setItem("theme", isDark ? "dark" : "light");
}
</script>

</body>
</html>
