<h2>🔔 Notificações</h2>

<ul class="list-group">
    {% for n in notificacoes %}
        <li class="list-group-item d-flex justify-content-between">

            {{ n.mensagem }}

            <form method="POST" action="/ler_notificacao/{{ n.id }}">
                <button class="btn btn-sm btn-success">OK</button>
            </form>

        </li>
    {% else %}
        <li class="list-group-item">Sem notificações</li>
    {% endfor %}
</ul>
