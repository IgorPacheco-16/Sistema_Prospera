<!DOCTYPE html>
<html>

<head>
    <title>OPs Arquivadas</title>

    <!-- darkmode -->
    <script>
    (function() {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    })();
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1 class="mb-4">📁 OPs Arquivadas</h1>

    <a href="/dashboard" class="btn btn-outline-light mb-3">
        ⬅ Voltar
    </a>

    <ul class="list-group">

        {% for op in ops %}
            <li class="list-group-item mb-2">

                <strong>{{ op.nome }}</strong>

                <br>

                📅
                {% if op.prazo_final %}
                    {{ op.prazo_final.strftime('%d/%m/%Y') }}
                {% else %}
                    Sem prazo
                {% endif %}

                <br>

                <span class="badge bg-dark">ARQUIVADA</span>

                <br><br>

                <form action="/desarquivar_op/{{ op.id }}" method="POST">
                    <button type="submit" class="btn btn-success btn-sm">
                        ♻️ Restaurar
                    </button>
                </form>
<form action="{{ url_for('excluir_op', id=op.id) }}" method="POST">
    <button type="submit"
        class="btn btn-sm btn-danger"
        onclick="return confirmarAcao('⚠️ Essa ação é permanente! Deseja excluir esta OP?')">
        🗑 Excluir
    </button>
</form>
            </li>
        {% else %}
            <li class="list-group-item">Nenhuma OP arquivada</li>
        {% endfor %}

    </ul>

    <script>
function confirmarAcao(mensagem) {
    return confirm(mensagem);
}
</script>


</div>

<!-- darkmode global -->
<script>
function toggleDarkMode() {
    const html = document.documentElement;

    html.classList.toggle("dark-mode");

    const isDark = html.classList.contains("dark-mode");

    localStorage.setItem("theme", isDark ? "dark" : "light");
}
</script>

</body>
</html>
