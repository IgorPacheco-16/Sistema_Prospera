{% extends "base/base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 fw-bold mb-4">Editar usuario</h2>

                {% if erro %}
                    <div class="alert alert-danger">{{ erro }}</div>
                {% endif %}

                <form method="POST" class="d-grid gap-3">
                    <div>
                        <label class="form-label" for="email">Email</label>
                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control"
                               value="{{ usuario.email }}"
                               required>
                    </div>

                    <div>
                        <label class="form-label" for="tipo">Tipo/permissao</label>
                        <select id="tipo" name="tipo" class="form-select" required>
                            {% for tipo in tipos %}
                                <option value="{{ tipo }}" {% if usuario.tipo == tipo %}selected{% endif %}>
                                    {{ tipo }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="form-label" for="setor">Setor vinculado</label>
                        <select id="setor" name="setor" class="form-select">
                            <option value="">Sem setor vinculado</option>
                            {% for s in setores %}
                                <option value="{{ s.id }}" {% if usuario.setor_id == s.id %}selected{% endif %}>
                                    {{ s.nome }}
                                </option>
                            {% endfor %}
                        </select>
                        <div class="form-text">
                            Obrigatorio para usuarios do tipo SETOR. Opcional para ADMIN, ATENDENTE e PCP.
                        </div>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input"
                               type="checkbox"
                               role="switch"
                               id="ativo"
                               name="ativo"
                               {% if usuario.ativo %}checked{% endif %}>
                        <label class="form-check-label" for="ativo">Usuario ativo</label>
                    </div>

                    <div>
                        <label class="form-label" for="nova_senha">Nova senha inicial</label>
                        <div class="input-group">
                            <input type="password" id="nova_senha" name="nova_senha" class="form-control">
                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    data-password-toggle="nova_senha">
                                Mostrar
                            </button>
                        </div>
                        <div class="form-text">Deixe em branco para manter a senha atual.</div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end flex-wrap">
                        <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function atualizarCampoSetor() {
    const tipo = document.getElementById("tipo");
    const setor = document.getElementById("setor");

    setor.required = tipo.value === "SETOR";
}

document.getElementById("tipo").addEventListener("change", atualizarCampoSetor);
atualizarCampoSetor();
</script>

{% endblock %}
