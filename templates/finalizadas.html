<!DOCTYPE html>
<html>

<head>
    <title>OPs Finalizadas</title>

    <!-- darkmode -->
    <script>
    (function() {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    })();
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

{% include "menu.html" %}

<div class="container mt-4">

    <h1 class="mb-4">✅ OPs Finalizadas</h1>

    <a href="/dashboard" class="btn btn-outline-light mb-3">
        ⬅ Voltar
    </a>

    <ul class="list-group">

        {% for op in ops %}
            <li class="list-group-item mb-2">

                <strong>{{ op.nome }}</strong>

                <br>

                📅 Prazo final:
                {% if op.prazo_final %}
                    {{ op.prazo_final.strftime('%d/%m/%Y') }}
                {% else %}
                    Sem prazo
                {% endif %}

                <br>

                <span class="badge bg-success">FINALIZADA</span>

                <br><br>

                <form action="/arquivar_op/{{ op.id }}" method="POST">
                    <button type="submit" class="btn btn-warning btn-sm">
                        📁 Arquivar
                    </button>
                </form>

            </li>
        {% else %}
            <li class="list-group-item">Nenhuma OP finalizada</li>
        {% endfor %}

    </ul>

</div>

<!-- Botão darkmode que roda em todas as pag -->
<script>
function toggleDarkMode() {
    const html = document.documentElement;

    html.classList.toggle("dark-mode");

    const isDark = html.classList.contains("dark-mode");

    localStorage.setItem("theme", isDark ? "dark" : "light");
}
</script>

</body>
</html>
