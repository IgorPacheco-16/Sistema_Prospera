<!DOCTYPE html>
<html>

<head>
    <title>Redefinir senha</title>

    <script>
    (function() {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>

<body>

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="width: 420px;">
        <h3 class="text-center mb-4">Redefinir senha</h3>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label" for="codigo">Codigo</label>
                <input type="text"
                       id="codigo"
                       name="codigo"
                       class="form-control"
                       inputmode="numeric"
                       autocomplete="one-time-code"
                       maxlength="6"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="nova_senha">Nova senha</label>
                <input type="password" id="nova_senha" name="nova_senha" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmar_senha">Confirmar nova senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100">
                Redefinir senha
            </button>
        </form>

        {% if erro %}
            <div class="alert alert-danger mt-3 text-center">
                {{ erro }}
            </div>
        {% endif %}

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="small">Voltar ao login</a>
        </div>
    </div>
</div>

</body>
</html>
