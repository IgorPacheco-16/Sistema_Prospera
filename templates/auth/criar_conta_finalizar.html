<!DOCTYPE html>
<html>

<head>
    <title>Finalizar cadastro</title>

    <script>
    (function() {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v={{ asset_version('css/theme.css') }}">
</head>

<body>

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="width: 460px;">
        <h3 class="text-center mb-4">Finalizar cadastro</h3>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label" for="nome">Nome</label>
                <input type="text" id="nome" name="nome" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="setor">Setor</label>
                <select id="setor" name="setor" class="form-select" required>
                    <option value="">Selecione um setor</option>
                    {% for s in setores %}
                        <option value="{{ s.id }}">{{ s.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label" for="senha">Senha</label>
                <div class="input-group">
                    <input type="password" id="senha" name="senha" class="form-control" required>
                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-password-toggle="senha">
                        Mostrar
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmar_senha">Confirmar senha</label>
                <div class="input-group">
                    <input type="password" id="confirmar_senha" name="confirmar_senha" class="form-control" required>
                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-password-toggle="confirmar_senha">
                        Mostrar
                    </button>
                </div>
            </div>

            <button class="btn btn-primary w-100">
                Criar conta
            </button>
        </form>

        {% if erro %}
            <div class="alert alert-danger mt-3 text-center">
                {{ erro }}
            </div>
        {% endif %}
    </div>
</div>

<script src="{{ url_for('static', filename='js/password_toggle.js') }}?v={{ asset_version('js/password_toggle.js') }}"></script>
</body>
</html>
